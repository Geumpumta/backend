name: Dev - CI (Build & Push)

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/geumpumta/backend
  GRADLE_OPTS: "-Dorg.gradle.workers.max=1"

jobs:
  test:
    name: Test (Gradle + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.ACTION_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Add +x permission to gradlew
        run: chmod +x gradlew

      - name: Docker sanity check
        run: |
          docker version
          docker info

      - name: Pre-pull docker images for tests
        run: |
          docker pull mysql:8.0
          docker pull redis:7.0-alpine

      - name: Run tests
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: true
        run: ./gradlew clean test --no-daemon --info

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: "**/build/test-results/test/TEST-*.xml"

      - name: Dump docker state on failure
        if: failure()
        run: |
          echo "==== docker ps -a ===="
          docker ps -a

          echo "==== mysql logs (tail) ===="
          docker ps -a --format "{{.ID}} {{.Image}}" | grep mysql | awk '{print $1}' | xargs -r -n1 docker logs --tail=200

          echo "==== redis logs (tail) ===="
          docker ps -a --format "{{.ID}} {{.Image}}" | grep redis | awk '{print $1}' | xargs -r -n1 docker logs --tail=200

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    outputs:
      image-tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.ACTION_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Add +x permission to gradlew
        run: chmod +x gradlew

      - name: Build bootJar (skip tests)
        run: ./gradlew bootJar -x test --no-daemon

      - name: Set image tag
        id: image
        run: |
          echo "image_tag=${IMAGE_NAME}:dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ACTION_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:dev-latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Image Tag
        run: |
          echo "${{ steps.image.outputs.image_tag }}" > image_tag.txt

      - name: Upload Image Tag Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image_tag.txt
