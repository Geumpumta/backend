name: Prod - CD with Docker

on:
  workflow_run:
    workflows: [ "Prod - Java CI with Gradle" ]
    types: [ completed ]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/geumpumta/backend

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.ACTION_TOKEN }}
          name: build-libs

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ACTION_TOKEN }}

      - name: Set image tag
        id: image
        run: |
          echo "image_tag=${IMAGE_NAME}:sha-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Print image tag
        run: |
          echo "Image tag: ${{ steps.image.outputs.image_tag }}"

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image_tag }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, prod, ec2]

    environment:
      name: production

    steps:
      - name: Login to GHCR
        run: |
          echo "${{ secrets.ACTION_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create runtime env file
        working-directory: /home/ubuntu/geumpumta
        run: |
          cat > .env.runtime <<EOF
          APP_IMAGE=${{ needs.build.outputs.image-tag }}
          MYSQL_DATABASE=${{ vars.MYSQL_DATABASE }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          SPRING_PROFILES_ACTIVE=${{ vars.SPRING_PROFILES_ACTIVE }}
          TZ=${{ vars.TZ }}
          WEB_PORT=${{ vars.WEB_PORT }}
          MYSQL_PORT=${{ vars.MYSQL_PORT }}
          REDIS_PORT=${{ vars.REDIS_PORT }}
          SPRING_DATASOURCE_URL=${{ vars.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME=${{ secrets.MYSQL_USER }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          SPRING_DATA_REDIS_HOST=${{ vars.SPRING_DATA_REDIS_HOST }}
          SPRING_DATA_REDIS_PORT=${{ vars.SPRING_DATA_REDIS_PORT }}
          EOF
          chmod 600 .env.runtime

      - name: Show Docker Compose config
        working-directory: /home/ubuntu/geumpumta
        run: |
          docker compose --env-file .env.runtime -f docker-compose.prod.yml config

      - name: Deploy with Docker Compose
        working-directory: /home/ubuntu/geumpumta
        run: |
          docker compose --env-file .env.runtime -f docker-compose.prod.yml pull
          docker compose --env-file .env.runtime -f docker-compose.prod.yml up -d

      - name: Health check
        run: |
          sleep 25
          curl -f http://localhost:${{ vars.WEB_PORT }}/actuator/health

      - name: Clean up old images
        run: |
          docker image prune -f
